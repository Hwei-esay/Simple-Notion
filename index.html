<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的想法集</title>
    <style>
        /* 基础页面设置 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9f9f9; /* 极淡的灰背景，护眼 */
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.8; /* 宽松的行高，阅读更舒服 */
        }

        /* 内容容器，限制最大宽度并居中 */
        .container {
            max-width: 680px;
            margin: 60px auto;
            padding: 0 20px;
            background-color: #fff;
            /* 如果想要更极简，可以去掉白色背景，直接用上面的灰背景 */
        }

        /* 标题样式 */
        h1 {
            font-size: 24px;
            font-weight: 300; /* 细体字更显极简 */
            margin-bottom: 40px;
            color: #111;
            text-align: center;
            letter-spacing: 2px;
        }

        /* 想法条目 */
        .entry {
            margin-bottom: 50px;
        }

        /* 日期或小标题 */
        .date {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
            display: block;
        }

        /* 正文样式 */
        .content {
            font-size: 16px;
            text-align: justify; /* 两端对齐 */
        }

        /* 图片样式 */
        .content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px 0;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 实分割线 */
        hr {
            border: 0;
            border-top: 1px solid #e0e0e0; /* 浅灰色实线 */
            margin: 50px 0;
        }

        /* 底部版权或额外信息 */
        footer {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THOUGHTS</h1>

        <!-- 第一条想法 -->
        <div class="entry">
            <span class="date">2025.12.23</span>
            <div class="content">
                <p>这里是第一条想法。极简主义不仅仅是视觉上的留白，更是一种对生活的态度。把无关紧要的剔除，剩下的才是最重要的。</p>
            </div>
        </div>

        <!-- 分割线 -->
        <hr>

        <!-- 第二条想法（带图片） -->
        <div class="entry">
            <span class="date">2025.12.22</span>
            <div class="content">
                <p>今天拍了一张很有感觉的照片。光影的变化总是能带来意想不到的宁静。</p>
                <!-- 插入图片，你可以把 src 换成你仓库里的图片链接 -->
                <img src="https://picsum.photos/seed/calm/600/400" alt="宁静的光影">
                <p>有时候不需要太多的语言描述，画面本身就是最好的表达。</p>
            </div>
        </div>

        <!-- 分割线 -->
        <hr>

        <!-- 第三条想法 -->
        <div class="entry">
            <span class="date">2025.12.20</span>
            <div class="content">
                <p>保持记录，保持思考。</p>
            </div>
        </div>

        <footer>
            &copy; 2025 My Minimal Space
        </footer>
    </div>

</body>
</html>
