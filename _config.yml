title : Simple-Notion
name: 'Simple-Notion'
# description: 'Simple, light weight, responsive jekyll theme for hackers'
url: https://hwei-esay.github.io/Simple-Notion

markdown: kramdown
highlighter: rouge
javascript_enabled: true

featured_posts_title: Unrelated
featured_posts:
  - url: '#'
    title: 'Featured post #1'
  - url: '#'
    title: 'Featured post #2'
  - url: '#'
    title: 'Featured post #3'

collections:
  news:
    title: Bulletins
    default_open: false
    output: true
  posts:
    title: Posts
    default_open: true
    output: true

defaults:
  - scope:
      type: posts
    values:
      title: Essays
      permalink: /post/:title
  - scope:
      type: news
    values:
      title: News
      permalink: /news/:title

plugins:
  - jekyll-sitemap
